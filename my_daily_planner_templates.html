<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мой ежедневник</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--bg:#f5f6f8;--panel:#fff;--text:#1f2328;--muted:#737a83;--line:#e6e8eb;--accent:#2563eb;--green:#16a34a;--danger:#dc2626;--shadow:0 8px 30px rgba(0,0,0,.07);--rowh:44px}
*{box-sizing:border-box}body{margin:0;font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}
.app{display:flex;height:100vh;overflow:hidden}.sidebar{width:235px;background:#111827;color:#fff;padding:18px 14px;display:flex;flex-direction:column;gap:8px}.brand{font-size:19px;font-weight:700;padding:6px 10px 18px}.nav button{width:100%;text-align:left;padding:10px 12px;border-radius:8px;color:#d1d5db}.nav button.active,.nav button:hover{background:#263142;color:#fff}.sidebottom{margin-top:auto;color:#9ca3af;font-size:12px;padding:10px}
.backupbar{display:flex;gap:6px;padding:0 10px 8px}
.backupbtn{flex:1;padding:7px 4px;border-radius:8px;background:#263142;color:#d1d5db;font-size:11.5px;font-weight:600;text-align:center;transition:background .15s ease}
.backupbtn:hover{background:#31405a}
.sidebarpending{padding:6px 10px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:4px}
.sidebarpending-title{font-size:11px;color:#8b93a1;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:8px 2px 6px;flex:0 0 auto}
.sidebarpending-empty{color:#6b7280;font-size:12px;padding:4px 2px}
.sidebarpending-item{display:flex;align-items:baseline;gap:7px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background .15s ease;flex:0 0 auto}
.sidebarpending-item:hover{background:#263142}
.sidebarpending-item.overdue{position:relative;background:rgba(220,38,38,.18);animation:overduePulse 1.8s ease-in-out infinite;overflow:hidden}
.sidebarpending-item.upcoming-far{background:rgba(22,163,74,.14)}
.sidebarpending-item.upcoming-far:hover{background:rgba(22,163,74,.22)}
.sidebarpending-item.upcoming-far .sidebarpending-time{color:#86efac}
.sidebarpending-item.upcoming-far .sidebarpending-name{color:#bbf7d0}

.sidebarpending-item.upcoming-soon{position:relative;background:rgba(217,119,6,.18);animation:upcomingSoonPulse 1.8s ease-in-out infinite}
.sidebarpending-item.upcoming-soon:hover{background:rgba(217,119,6,.28)}
.sidebarpending-item.upcoming-soon .sidebarpending-time{color:#fcd34d}
.sidebarpending-item.upcoming-soon .sidebarpending-name{color:#fde68a}
@keyframes upcomingSoonPulse{0%,100%{box-shadow:0 0 0 0 rgba(217,119,6,0),inset 0 0 0 1px rgba(252,211,77,.16)}50%{box-shadow:0 0 12px 2px rgba(217,119,6,.5),inset 0 0 0 1px rgba(252,211,77,.6)}}
.sidebarpending-item.overdue:hover{background:rgba(220,38,38,.28)}
.sidebarpending-item.overdue .sidebarpending-time{color:#fca5a5}
.sidebarpending-item.overdue .sidebarpending-name{color:#fecaca}
@keyframes overduePulse{0%,100%{box-shadow:0 0 0 0 rgba(239,68,68,0),inset 0 0 0 1px rgba(248,113,113,.18)}50%{box-shadow:0 0 13px 2px rgba(239,68,68,.56),inset 0 0 0 1px rgba(248,113,113,.68)}}
.sidebarpending-item.overdue:before{content:"";position:absolute;inset:0;border:1px solid rgba(248,113,113,.34);border-radius:8px;box-shadow:inset 0 0 5px rgba(239,68,68,.22);pointer-events:none;box-sizing:border-box;z-index:1}
.overdueflare{position:absolute;top:0;left:0;width:60px;height:100%;pointer-events:none;z-index:3;offset-path:inset(0 round 8px);offset-distance:0%;animation:overdueFlareRun 8s linear infinite;mix-blend-mode:screen}
.overdueflare svg{position:absolute;top:50%;left:50%;width:60px;height:60px;transform:translate(-50%,-50%) rotate(90deg);overflow:visible}
@keyframes overdueFlareRun{0%{offset-distance:0%}100%{offset-distance:100%}}
@keyframes overdueWaveRun{
  0%{offset-path:inset(0 round 8px);offset-distance:0%;transform:rotate(90deg)}
  100%{offset-path:inset(0 round 8px);offset-distance:100%;transform:rotate(90deg)}
}
.sidebarpending-time{color:#5ac8fa;font-size:11.5px;font-weight:700;flex:0 0 auto;white-space:nowrap}
.sidebarpending-name{color:#d1d5db;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{height:70px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:12px}.title{font-size:20px;font-weight:700;margin-right:auto}.viewtabs{display:flex;background:#f1f3f5;border-radius:8px;padding:3px}.viewtabs button{padding:7px 12px;border-radius:6px}.viewtabs .sel{background:#fff;box-shadow:0 1px 4px #0001}.iconbtn{padding:8px;border-radius:7px}.primary{background:var(--accent);color:#fff;padding:9px 14px;border-radius:8px;font-weight:600}.secondary{padding:9px 13px;border:1px solid #d9dde2;border-radius:8px}.content{padding:18px 22px;overflow:auto;flex:1}.dayhead{display:flex;align-items:center;gap:8px;margin-bottom:14px}.datebig{font-size:17px;font-weight:700;margin:0 10px}.weekday{color:var(--muted)}.quickadd{display:flex;gap:8px;padding:12px 22px;background:#fff;border-bottom:1px solid var(--line)}.quickadd input{flex:1;border:1px solid #d9dde2;border-radius:8px;padding:9px 12px}.quickhint{padding:0 22px 10px;font-size:11px;color:var(--muted)}
.notime,.monthgrid,.weekgrid{background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.notime{padding:10px;margin-bottom:14px;display:grid;gap:6px}.notimelabel{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.timeline{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow-x:auto;overflow-y:hidden}
.gridlines{position:relative}
.gridrow{display:grid;grid-template-columns:75px 1fr;border-bottom:1px solid var(--line);height:var(--rowh)}
.gridrow .time{color:#8a9199;padding:6px 10px 0 0;text-align:right;border-right:1px solid var(--line);font-size:12px;font-weight:400;line-height:1.2;font-family:inherit}
.gridrow .slotbg{border-right:0;cursor:pointer}
.gridrow .slotbg:hover{background:#fafbfc}
.taskslayer{position:absolute;top:0;left:75px;right:0;bottom:0;pointer-events:none;min-width:1px}
.taskblock{position:absolute;background:#fff;border:1px solid #dfe3e8;border-left:4px solid var(--accent);border-radius:8px;box-shadow:0 2px 7px #0000000a;padding:6px 8px;overflow:hidden;pointer-events:auto;display:flex;flex-direction:column;box-sizing:border-box;transition:transform .35s cubic-bezier(.34,1.56,.64,1),box-shadow .35s ease,border-color .35s ease;cursor:grab}
.taskblock.dragging{cursor:grabbing;opacity:.85;box-shadow:0 10px 26px #0003;z-index:5;transition:none!important}
.taskdragghost{position:absolute;left:0;right:0;background:#eef4ff;border:1.5px dashed var(--accent);border-radius:8px;pointer-events:none;z-index:1}
.taskblock.done{opacity:.65}
.taskblock.done .tasktitle{text-decoration:line-through}
.taskblock.celebrate{animation:taskPop .55s cubic-bezier(.34,1.56,.64,1);border-color:var(--green)!important;box-shadow:0 0 0 3px #16a34a33,0 8px 24px #16a34a2e!important}
@keyframes taskPop{0%{transform:scale(1)}35%{transform:scale(1.045) rotate(-.4deg)}60%{transform:scale(.985) rotate(.3deg)}100%{transform:scale(1)}}
.taskrow{display:flex;align-items:flex-start;gap:6px;flex-wrap:nowrap;min-width:0;width:100%}
.check{width:18px;height:18px;border:2px solid #9aa1a9;border-radius:50%;flex:0 0 auto;margin-top:1px;background:#fff;position:relative;transition:transform .25s cubic-bezier(.34,1.56,.64,1),border-color .25s ease,background .25s ease}
.check.on{border-color:var(--green);background:var(--green);color:#fff;font-size:11px}
.taskbody{min-width:0;flex:1 1 auto;overflow:hidden}
.tasktitle{font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taskmeta{font-size:10.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taskobj{font-size:10.5px;color:#7c3aed;font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.taskactions{display:flex;gap:2px;margin-left:auto;flex:0 0 auto}
.taskactions button{padding:2px 4px;color:#6b7280;font-size:11px}
.focusbtn{padding:2px 6px;border-radius:6px;background:#eef4ff;color:#1d4ed8;font-size:10.5px;white-space:nowrap;flex:0 0 auto}
.subtasks{margin:5px 0 0 24px;display:grid;gap:3px;min-width:0}
.sub{display:flex;align-items:center;gap:6px;font-size:11px;flex-wrap:nowrap;min-width:0;border-radius:5px}
.sub .subtext{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 1.1s cubic-bezier(.22,.9,.3,1),font-weight 1.1s ease}
.sub .subtext.success{color:#166534}
.sub .subtext.failed{color:#991b1b;text-decoration:line-through}
.sub.glow-success .subtext{animation:subtextGlowSuccess 1.4s cubic-bezier(.22,.9,.3,1)}
.sub.glow-failed .subtext{animation:subtextGlowFailed 1.4s cubic-bezier(.22,.9,.3,1)}
@keyframes subtextGlowSuccess{0%{background:transparent;color:inherit}25%{background:#bbf7d0;color:#166534;border-radius:4px}100%{background:transparent;color:#166534}}
@keyframes subtextGlowFailed{0%{background:transparent;color:inherit}25%{background:#fecaca;color:#991b1b;border-radius:4px}100%{background:transparent;color:#991b1b}}
.subverdict{display:flex;gap:3px;flex:0 0 auto;order:-1}
.vbtn{width:19px;height:19px;border-radius:5px;border:1px solid #d9dde2;display:grid;place-items:center;font-size:12px;line-height:1;color:#b7bcc2;background:#fff;flex:0 0 auto;position:relative;transition:transform .28s cubic-bezier(.34,1.56,.64,1),background .28s ease,border-color .28s ease,color .28s ease}
.vbtn.success.active{background:#dcfce7;border-color:#16a34a;color:#16a34a}
.vbtn.failed.active{background:#fee2e2;border-color:#dc2626;color:#dc2626}
.vbtn.bump{transform:scale(1.4) rotate(-8deg)}
.subnoteicon{width:15px;height:15px;border-radius:4px;background:#f3f4f6;color:#9ca3af;font-size:9px;display:grid;place-items:center;flex:0 0 auto;margin-left:2px}
.subnoteicon.has{background:#ede9fe;color:#7c3aed}
.add
